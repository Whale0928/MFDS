version: '3.17'

tasks:
  api:
    desc: 127.0.0.1:8787에서 조회 전용 API를 실행합니다
    dir: api
    preconditions:
      - sh: test -f ../../../.env.local
        msg: 루트에서 task setup을 먼저 실행하세요
      - sh: test -n "$(sed -n 's/^MFDS_DEMO_DSN=//p' ../../../.env.local)"
        msg: MFDS_DEMO_DSN이 필요합니다
    cmds:
      - MFDS_DEMO_DSN="$(sed -n 's/^MFDS_DEMO_DSN=//p' ../../../.env.local)" go run .

  web:
    desc: 127.0.0.1:5173에서 React 개발 서버를 실행합니다
    dir: web
    cmds:
      - npm run dev -- --host 127.0.0.1

  serve:
    desc: API와 web을 launchd 서비스로 올려 터미널과 무관하게 유지합니다
    vars:
      API_LABEL: com.bottlenote.mfds.normalization-dashboard-api
      WEB_LABEL: com.bottlenote.mfds.normalization-dashboard-web
      API_LOG: /tmp/mfds-normalization-dashboard-api.log
      WEB_LOG: /tmp/mfds-normalization-dashboard-web.log
    preconditions:
      - sh: test -n "$(sed -n 's/^MFDS_DEMO_DSN=//p' ../../.env.local)"
        msg: MFDS_DEMO_DSN이 필요합니다. 루트에서 task setup을 먼저 실행하세요
    cmds:
      # 셸 세션이 끝나도 살아 있어야 시연 중에 화면이 죽지 않는다.
      # launchd는 기본 PATH만 보므로 실행 파일과 작업 경로를 모두 절대 경로로 넘긴다.
      - task: api:build
      - |
        root="$(pwd)"
        if ! launchctl list "{{.API_LABEL}}" > /dev/null 2>&1; then
          launchctl submit -l "{{.API_LABEL}}" -o "{{.API_LOG}}" -e "{{.API_LOG}}" -- \
            /bin/sh -c "cd '$root/api' && MFDS_DEMO_DSN='$(sed -n 's/^MFDS_DEMO_DSN=//p' ../../.env.local)' ./dashboard-api"
        fi
        if ! launchctl list "{{.WEB_LABEL}}" > /dev/null 2>&1; then
          launchctl submit -l "{{.WEB_LABEL}}" -o "{{.WEB_LOG}}" -e "{{.WEB_LOG}}" -- \
            /bin/sh -c "cd '$root/web' && '$(command -v npm)' run dev -- --host 127.0.0.1"
        fi
        for _ in $(seq 1 40); do
          api="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8787/healthz || true)"
          web="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5173/ || true)"
          [ "$api" = "200" ] && [ "$web" = "200" ] && break
          sleep 1
        done
        if [ "$api" != "200" ] || [ "$web" != "200" ]; then
          echo "기동 실패 (api=$api web=$web). {{.API_LOG}} 와 {{.WEB_LOG}} 를 확인하세요." >&2
          exit 1
        fi
        echo "API 127.0.0.1:8787, web 127.0.0.1:5173 이 떴습니다. 중지는 serve:stop 입니다."

  serve:stop:
    desc: launchd로 올린 API와 web을 중지합니다
    vars:
      API_LABEL: com.bottlenote.mfds.normalization-dashboard-api
      WEB_LABEL: com.bottlenote.mfds.normalization-dashboard-web
    cmds:
      # kill만 하면 launchd가 되살리므로 서비스 등록 자체를 지운다.
      - |
        stopped=0
        for label in "{{.API_LABEL}}" "{{.WEB_LABEL}}"; do
          if launchctl list "$label" > /dev/null 2>&1; then
            launchctl remove "$label"
            stopped=$((stopped + 1))
          fi
        done
        if [ "$stopped" -gt 0 ]; then
          echo "서비스 ${stopped}개를 중지했습니다."
        else
          echo "실행 중인 서비스가 없습니다."
        fi

  tunnel:
    desc: 실행 중인 화면을 Cloudflare quick tunnel로 외부에 공개합니다
    vars:
      LABEL: com.bottlenote.mfds.normalization-dashboard-tunnel
      LOG: /tmp/mfds-normalization-dashboard-cloudflared.log
    preconditions:
      - sh: command -v cloudflared
        msg: cloudflared 설치가 필요합니다 (brew install cloudflared)
      - sh: curl -sf -o /dev/null http://127.0.0.1:5173/
        msg: web 태스크를 먼저 실행하세요
      - sh: curl -sf -o /dev/null http://127.0.0.1:8787/healthz
        msg: api 태스크를 먼저 실행하세요
    cmds:
      # launchctl submit으로 등록하면 터미널을 닫아도 살아있고, 죽여도 launchd가 되살린다.
      # 그래서 중지는 반드시 tunnel:stop(launchctl remove)으로 해야 한다.
      - |
        if launchctl list "{{.LABEL}}" > /dev/null 2>&1; then
          echo "이미 터널이 열려 있습니다. 주소는 tunnel:url, 닫으려면 tunnel:stop 을 쓰세요." >&2
          exit 1
        fi
        rm -f "{{.LOG}}"
        # launchd는 기본 PATH만 보므로 실행 파일을 절대 경로로 넘겨야 한다.
        launchctl submit -l "{{.LABEL}}" -o "{{.LOG}}" -e "{{.LOG}}" -- \
          "$(command -v cloudflared)" tunnel --url http://127.0.0.1:5173 --no-autoupdate
        for _ in $(seq 1 40); do
          url="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "{{.LOG}}" 2>/dev/null | tail -1)"
          [ -n "$url" ] && break
          sleep 1
        done
        if [ -z "$url" ]; then
          echo "터널 주소를 얻지 못했습니다. {{.LOG}} 를 확인하세요." >&2
          exit 1
        fi
        printf '외부 공개 주소: %s\n이 주소는 인터넷 전체에 공개됩니다. 시연이 끝나면 tunnel:stop 으로 닫으세요.\n' "$url"

  tunnel:url:
    desc: 열려 있는 터널의 외부 주소를 다시 출력합니다
    vars:
      LABEL: com.bottlenote.mfds.normalization-dashboard-tunnel
      LOG: /tmp/mfds-normalization-dashboard-cloudflared.log
    cmds:
      - |
        if ! launchctl list "{{.LABEL}}" > /dev/null 2>&1; then
          echo "열려 있는 터널이 없습니다. tunnel 태스크를 먼저 실행하세요." >&2
          exit 1
        fi
        url="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "{{.LOG}}" 2>/dev/null | tail -1)"
        if [ -z "$url" ]; then
          echo "터널은 떠 있지만 주소를 찾지 못했습니다. {{.LOG}} 를 확인하세요." >&2
          exit 1
        fi
        echo "$url"

  tunnel:stop:
    desc: 외부 공개 터널을 중지합니다
    vars:
      LABEL: com.bottlenote.mfds.normalization-dashboard-tunnel
      LOG: /tmp/mfds-normalization-dashboard-cloudflared.log
    cmds:
      # kill만 하면 launchd가 즉시 되살리므로 서비스 등록 자체를 지운다.
      - |
        if launchctl list "{{.LABEL}}" > /dev/null 2>&1; then
          launchctl remove "{{.LABEL}}"
          echo "터널을 중지했습니다."
        else
          echo "실행 중인 터널이 없습니다."
        fi
        rm -f "{{.LOG}}"

  test:
    desc: API와 web 테스트를 실행합니다
    cmds:
      - task: api:test
      - task: web:test

  api:test:
    dir: api
    cmds:
      - go test -count=1 ./...
      - go vet ./...

  web:test:
    dir: web
    cmds:
      - npm test
      - npm run build

  build:
    desc: 독립 API binary와 web production asset을 빌드합니다
    cmds:
      - task: api:build
      - task: web:build

  api:build:
    dir: api
    cmds:
      - go build -o dashboard-api .

  web:build:
    dir: web
    cmds:
      - npm run build

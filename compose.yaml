services:
  mysql:
    image: mysql:9.7.1
    container_name: mfds-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mfds_ledger}
      MYSQL_USER: ${MYSQL_USER:-mfds}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --max-connections=100
    ports:
      - "3306:3306"
    volumes:
      - mfds_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 30

  flyway:
    image: flyway/flyway:11.20.3-alpine
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./git.environment-variables/storage/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mfds_ledger}?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_USER:-mfds}
      - -password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - -connectRetries=10
      - migrate

volumes:
  mfds_mysql_data:
